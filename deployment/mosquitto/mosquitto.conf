# ---------------------------------------------------------------------------
# Broker MQTT của GasGuard (Mosquitto 2.0, Dynamic Security)
#
# 1883 – MQTT KHÔNG mã hóa: chỉ dùng trong mạng nội bộ Docker (backend) và trên chính máy chủ
#        (docker-compose chỉ mở cổng này ở 127.0.0.1, máy khác trong LAN không kết nối được).
# 8883 – MQTT qua TLS: cổng duy nhất mở cho thiết bị ESP32 trong LAN. Đường truyền được mã hóa,
#        thiết bị kiểm tra chứng chỉ broker bằng CA của nhóm (deployment/certs/gen-certs.sh).
# Cả hai cổng đều bắt buộc đăng nhập (không cho anonymous) và dùng chung ACL theo thiết bị.
# ---------------------------------------------------------------------------
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

listener 1883

listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
connection_messages true
