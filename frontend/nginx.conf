# nginx cho GasGuard: file tĩnh React + reverse proxy tới backend Spring Boot, phục vụ qua HTTPS.
# File này là TEMPLATE: khi container khởi động, image nginx thay ${WEB_HTTPS_PORT} bằng biến môi trường
# (chỉ các biến được khai báo; biến của nginx như $host giữ nguyên).
# Chứng chỉ: deployment/certs/server/ (tạo bằng deployment/certs/gen-certs.sh), gắn vào /etc/nginx/certs.

# Cổng mà trình duyệt đang dùng (lấy từ Host), báo cho backend qua X-Forwarded-Port
map $http_host $gg_forwarded_port {
    "~:(?<p>[0-9]+)$" $p;
    default 443;
}

# ---------------------------------------------------------------------------- HTTP: chỉ chuyển hướng
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Healthcheck của Docker (trong container) không cần TLS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mọi truy cập HTTP khác -> HTTPS, không phục vụ dữ liệu qua kết nối không mã hóa
    location / {
        return 301 https://$host:${WEB_HTTPS_PORT}$request_uri;
    }
}

# ---------------------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;                      # không lộ phiên bản nginx
    client_max_body_size 1m;                # API chỉ nhận JSON nhỏ

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    # Header bảo mật (lặp lại ở từng location vì add_header không kế thừa khi location có add_header riêng).
    # Không bật HSTS: chứng chỉ do CA của nhóm tự ký, HSTS trên localhost/IP sẽ ép HTTPS cả cho các cổng dev khác.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API. Giữ nguyên Host (gồm cả cổng) và báo giao thức https + cổng gốc để Spring coi là cùng origin.
    # X-Forwarded-For bị GHI ĐÈ bằng IP thật của client -> client không giả mạo được IP trong audit log.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $gg_forwarded_port;
        proxy_read_timeout 60s;
        proxy_buffering off;                # tải CSV lớn theo luồng
    }

    # WebSocket STOMP (cập nhật thời gian thực), đi trong cùng kết nối TLS (wss://)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $gg_forwarded_port;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # File build của Vite có hash trong tên -> cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single Page App: mọi đường dẫn khác trả về index.html (React Router xử lý)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
